<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10172a" />
    <title>Skybound - 横スクロールアクション</title>
    <link rel="stylesheet" href="style.css" />
    <script src="game.js" defer></script>
  </head>
  <body>
    <main class="game-shell">
      <header class="game-header">
        <div>
          <p class="eyebrow">MINI PLATFORMER</p>
          <h1>Skybound <span>冒険のはじまり</span></h1>
        </div>
        <div class="score-panel" aria-live="polite">
          <span>コイン</span>
          <strong id="coin-count">0</strong>
        </div>
      </header>

      <section class="game-frame" aria-label="横スクロールアクションゲーム">
        <canvas id="game" width="960" height="540" aria-label="ゲーム画面">
          このゲームを遊ぶにはCanvasに対応したブラウザが必要です。
        </canvas>
        <div class="message" id="message" role="status" hidden></div>
      </section>

      <footer class="game-footer">
        <p class="instructions">
          <span><kbd>←</kbd><kbd>→</kbd> または <kbd>A</kbd><kbd>D</kbd> 移動</span>
          <span><kbd>Space</kbd> / <kbd>↑</kbd> ジャンプ</span>
          <span>コインを集めてゴールへ！</span>
        </p>
        <div class="touch-controls" aria-label="タッチ操作">
          <button class="control-button" data-control="left" aria-label="左へ移動">←</button>
          <button class="control-button jump-button" data-control="jump" aria-label="ジャンプ">JUMP</button>
          <button class="control-button" data-control="right" aria-label="右へ移動">→</button>
        </div>
        <button class="restart-button" id="restart">最初から</button>
      </footer>
    </main>
  </body>
</html>
